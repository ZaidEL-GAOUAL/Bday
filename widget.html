<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Bday widget</title>
  <meta name="theme-color" content="#f5edcf" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="application-name" content="Birthday Wall" />
  <meta name="mobile-web-app-capable" content="yes" />
  <style>
    :root {
      --paper: #f5edcf;
      --ink: #1f1812;
      --ink-soft: #5a4f44;
      --tomato: #e4634a;
      --mustard: #d9b53f;
      --mint: #7ac4a9;
      --sky: #8ab8d8;
      --lavender: #b399ce;
      --pink: #e598a2;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, "Bricolage Grotesque", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .frame { min-height: 100%; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .label { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: var(--ink-soft); text-transform: uppercase; }
    .hero { display: flex; align-items: center; gap: 8px; }
    .dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; box-shadow: inset 0 -2px 3px rgba(0,0,0,.15); }
    .hero-name { font-size: 28px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hero-sub { font-size: 14px; color: var(--ink-soft); font-weight: 600; margin-top: 4px; }
    .others { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .row .dot { width: 8px; height: 8px; }
    .row .name { flex: 1; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .sub { font-size: 12px; color: var(--ink-soft); }
    .photo { margin-top: auto; width: 100%; aspect-ratio: 1 / 1; max-height: 220px; background: rgba(120, 80, 40, .08); border-radius: 8px; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo .empty { font-family: "Caveat", cursive; font-size: 18px; color: var(--ink-soft); }
    .footer { font-size: 9px; font-family: ui-monospace, monospace; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); margin-top: 4px; }
    .error { color: var(--tomato); font-weight: 700; font-size: 14px; }
    .gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .gate-card { max-width: 360px; width: 100%; background: #fbfaf3; border-radius: 10px; padding: 22px; box-shadow: 0 18px 36px rgba(0,0,0,.10); }
    .gate-card h1 { font-size: 22px; margin: 0 0 6px; }
    .gate-card p { font-size: 14px; color: var(--ink-soft); margin: 0 0 14px; font-family: "Caveat", cursive; font-weight: 600; font-size: 16px; }
    .gate-card input { width: 100%; padding: 10px 12px; border: 2px solid var(--ink); border-radius: 4px; font-family: ui-monospace, monospace; font-size: 16px; background: #fff; outline: none; }
    .gate-card input.err { border-color: var(--tomato); animation: wig .2s ease 2; }
    .gate-card button { margin-top: 12px; padding: 8px 18px; font-family: inherit; font-weight: 700; font-size: 14px; background: var(--mustard); border: 2px solid var(--ink); border-radius: 999px; cursor: pointer; box-shadow: 0 4px 0 var(--ink); }
    .gate-card button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
    @keyframes wig { 0%,100%{transform:translateX(0)} 50%{transform:translateX(4px)} }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const CONVEX_SITE_URL = "https://fantastic-pigeon-993.convex.site";
    const KEY = "bw-widget-passcode";

    function colorFromCss(c){
      if (!c) return "var(--ink-soft)";
      return c.startsWith("var(") ? c : "var(--ink)";
    }
    function fmtDays(n){
      if (n === 0) return "today 🎉";
      if (n === 1) return "tomorrow";
      return "in " + n + " days";
    }
    function clearChildren(node){
      while (node.firstChild) node.removeChild(node.firstChild);
    }
    function el(tag, props, ...children){
      const node = Object.assign(document.createElement(tag), props || {});
      for (const c of children) {
        if (c == null) continue;
        node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
      }
      return node;
    }

    async function loadData(passcode){
      const r = await fetch(CONVEX_SITE_URL + "/widget-data", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ passcode }),
      });
      const data = await r.json().catch(() => null);
      if (!r.ok) throw Object.assign(new Error((data && data.error) || "request failed"), { status: r.status, body: data });
      return data;
    }

    function root(){ return document.getElementById("root"); }

    function renderGate(initialError){
      const r = root();
      clearChildren(r);
      const gate = el("div", { className: "gate" });
      const card = el("div", { className: "gate-card" });
      const h1 = el("h1", null, "Birthday Wall widget");
      const p = el("p", null, "enter the passcode once — it's saved on this device only.");
      const input = el("input", { type: "password", placeholder: "passcode", autocomplete: "off", spellcheck: false });
      if (initialError) input.classList.add("err");
      const btn = el("button", null, "save");
      const onSubmit = async () => {
        const v = input.value.trim();
        if (!v) return;
        try {
          await loadData(v);
          localStorage.setItem(KEY, v);
          mount(v);
        } catch (e) {
          input.classList.add("err");
          input.value = "";
          input.focus();
        }
      };
      btn.addEventListener("click", onSubmit);
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") onSubmit(); });
      card.append(h1, p, input, btn);
      gate.appendChild(card);
      r.appendChild(gate);
      setTimeout(() => input.focus(), 0);
    }

    function renderError(msg){
      const r = root();
      clearChildren(r);
      const f = el("div", { className: "frame" });
      f.append(
        el("div", { className: "label" }, "the birthday wall"),
        el("div", { className: "error" }, msg)
      );
      r.appendChild(f);
    }

    async function render(passcode){
      let data;
      try {
        data = await loadData(passcode);
      } catch (e) {
        if (e.status === 403) {
          localStorage.removeItem(KEY);
          renderGate(true);
          return;
        }
        renderError("couldn't reach the wall");
        return;
      }
      const r = root();
      clearChildren(r);
      const f = el("div", { className: "frame" });
      f.appendChild(el("div", { className: "label" }, "the birthday wall"));

      const next = (data.next || [])[0];
      if (next) {
        const hero = el("div", { className: "hero" });
        const dot = el("span", { className: "dot" });
        dot.style.background = colorFromCss(next.color);
        const wrap = el("div", null);
        wrap.appendChild(el("div", { className: "hero-name" }, next.name));
        wrap.appendChild(el("div", { className: "hero-sub" }, fmtDays(next.days)));
        hero.append(dot, wrap);
        f.appendChild(hero);
      }

      const rest = (data.next || []).slice(1, 3);
      if (rest.length) {
        const others = el("div", { className: "others" });
        for (const n of rest) {
          const row = el("div", { className: "row" });
          const d = el("span", { className: "dot" });
          d.style.background = colorFromCss(n.color);
          row.append(d, el("span", { className: "name" }, n.name), el("span", { className: "sub" }, fmtDays(n.days)));
          others.appendChild(row);
        }
        f.appendChild(others);
      }

      const photo = el("div", { className: "photo" });
      if (data.featured_photo && data.featured_photo.url) {
        photo.appendChild(el("img", { src: data.featured_photo.url, alt: data.featured_photo.caption || "" }));
      } else {
        photo.appendChild(el("div", { className: "empty" }, "no photos yet"));
      }
      f.appendChild(photo);

      const updated = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      f.appendChild(el("div", { className: "footer" }, "updated · " + updated));

      r.appendChild(f);
    }

    function mount(passcode){
      render(passcode);
      setInterval(() => { if (!document.hidden) render(passcode); }, 5 * 60 * 1000);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) render(passcode); });
    }

    // Register the service worker so Chrome offers "Install" on Android.
    // Scoped to this page only, so it won't touch the main site.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }

    // Boot: passcode comes from ?p= (one-tap setup) or localStorage.
    const url = new URL(location.href);
    const fromUrl = url.searchParams.get("p");
    if (fromUrl) {
      localStorage.setItem(KEY, fromUrl);
      url.searchParams.delete("p");
      history.replaceState(null, "", url.toString());
    }
    const passcode = localStorage.getItem(KEY);
    if (passcode) mount(passcode);
    else renderGate(false);
  </script>
</body>
</html>
